name: Build and publish digest

on:
  schedule:
    # Every 20 minutes. Public-repo Actions minutes are unmetered on GitHub-hosted runners, and each
    # run is a handful of small HTTP fetches — there is no cost to running this often.
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # `classified-digest.json` is pushed straight to this repo's root by a different, separate job
      # (Game of People's own news-digest publisher — see that project's ADR-209), on its own
      # schedule. It is not part of this repo's own build (`scripts/build-digest.mjs` never produces
      # it), so it has to be carried into `dist/` by hand here, or Pages never serves it — `dist/` is
      # the only thing `upload-pages-artifact` below ever sees. Conditional because the very first
      # deploy after that other job is wired up, or any deploy that happens to race ahead of its
      # first successful push, should still publish `digest.json` correctly with nothing missing.
      - name: Carry the classified digest into dist/, if the other job has published one
        run: |
          if [ -f classified-digest.json ]; then
            cp classified-digest.json dist/classified-digest.json
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
